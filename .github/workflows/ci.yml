# Quality gate for every push and pull request (Stage 02, docs/11).
# Actions are pinned to full commit SHAs: a moved tag cannot change what runs here (Stage 24).
# Runs the same commands as `npm run check` locally, on Linux and Windows.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Install workspace (locked)
        run: uv sync --all-packages --locked
      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check (mypy strict)
        run: uv run mypy
      - name: Module boundaries
        run: uv run lint-imports
      - name: Tests
        run: uv run pytest

  typescript:
    name: TypeScript (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install (locked)
        run: npm ci
      - name: Lint and format
        run: npm run lint
      - name: Type check (strict)
        run: npm run typecheck
      - name: Tests
        run: npm run test:ts

  contracts:
    name: Contracts drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: uv sync --all-packages --locked
      - run: npm ci
      - name: Generated schema and TypeScript types match the Python source
        run: npm run contracts:check

  web:
    name: Web (build, accessibility, viewports)
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install (locked)
        run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Production build
        run: npm run build:web
      - name: Browser tests at 1440, 768 and 390 px (axe, keyboard, dialog, drawer, links)
        run: npm run test:e2e
      - name: Keep the Playwright report when tests fail
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Known vulnerabilities in what the app ships (npm)
        run: npm audit --omit=dev --audit-level=moderate
      - name: Known vulnerabilities in the locked Python packages
        run: |
          uv export --locked --all-packages --no-emit-workspace --no-hashes --format requirements-txt -o requirements-audit.txt
          uvx --from pip-audit pip-audit --disable-pip --no-deps -r requirements-audit.txt
