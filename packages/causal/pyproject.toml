[project]
name = "multiverse-causal"
version = "0.1.0"
description = "Causal research: DAGs, identification assumptions, estimators and diagnostics."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["multiverse-contracts"]

[tool.uv.sources]
multiverse-contracts = { workspace = true }
