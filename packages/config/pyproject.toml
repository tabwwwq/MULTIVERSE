[project]
name = "multiverse-config"
version = "0.1.0"
description = "Validated runtime settings and environment profiles of MULTIVERSE."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["pydantic>=2.9", "pydantic-settings>=2.6"]

[build-system]
requires = ["uv_build>=0.8.0,<0.12"]
build-backend = "uv_build"
