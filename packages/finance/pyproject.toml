[project]
name = "multiverse-finance"
version = "0.1.0"
description = "Pure financial formulas: statements, identities, FCFF, DCF and the EV to equity bridge."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["multiverse-contracts"]

[tool.uv.sources]
multiverse-contracts = { workspace = true }
multiverse-config = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.0,<0.12"]
build-backend = "uv_build"
