[project]
name = "multiverse-jobs"
version = "0.1.0"
description = "Durable state of long jobs: queue, leases, budgets and estimates, without any training."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["multiverse-contracts"]

[tool.uv.sources]
multiverse-contracts = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.0,<0.12"]
build-backend = "uv_build"
