[project]
name = "multiverse-simulation"
version = "0.1.0"
description = "Paired Monte Carlo: shared shocks, the finance engine on every path, summaries."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "multiverse-config",
    "multiverse-contracts",
    "multiverse-finance",
    "multiverse-forecast",
    "multiverse-pipelines",
    "numpy>=2.0",
]

[tool.uv.sources]
multiverse-contracts = { workspace = true }
multiverse-finance = { workspace = true }
multiverse-forecast = { workspace = true }
multiverse-pipelines = { workspace = true }
multiverse-config = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.0,<0.12"]
build-backend = "uv_build"
