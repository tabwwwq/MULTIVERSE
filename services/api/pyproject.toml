[project]
name = "multiverse-api"
version = "0.1.0"
description = "HTTP API of MULTIVERSE (FastAPI): validation, scenarios, job records, reports."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["multiverse-contracts", "multiverse-config", "fastapi>=0.115", "uvicorn>=0.32"]

[tool.uv.sources]
multiverse-contracts = { workspace = true }
multiverse-config = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.0,<0.12"]
build-backend = "uv_build"
