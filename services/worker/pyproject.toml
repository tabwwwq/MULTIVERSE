[project]
name = "multiverse-worker"
version = "0.1.0"
description = "Background worker: queued simulation and training jobs with checkpoints and budgets."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["multiverse-contracts", "multiverse-config"]

[project.scripts]
multiverse-worker = "multiverse_worker.main:main"

[tool.uv.sources]
multiverse-contracts = { workspace = true }
multiverse-config = { workspace = true }

[build-system]
requires = ["uv_build>=0.8.0,<0.12"]
build-backend = "uv_build"
